# office-env-base.yaml — オフィス環境モニタ 3台共通ベース設定
# 回路図v3対応: SCD41 + SGP41 + SSD1306 (I2C: GPIO6/7) / INMP441 (I2S: GPIO4/5/3)
# 使い方: env-1.yaml 等の薄いラッパーから packages で include する
# 注意: sound_level は新しめの公式コンポーネント。ESPHome本体を最新にしてビルドすること

substitutions:
  device_name: env-0        # ラッパー側で上書き
  friendly_name: Office Env 0
  room: test                # InfluxDBのroomタグ。英小文字スネークケース
  co2_high: "1500"          # CO2警告バナー(CO2 HIGH)閾値[ppm]。ダッシュボードJS/READMEの閾値と揃える
  co2_blink: "1000"         # CO2数字を白黒反転させる異常値閾値[ppm]（旧仕様の点滅から変更・キー名は互換のため据え置き）

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  # cpu_frequency は 160MHz(既定)を維持。80MHzは不可: HTTPS(TLS) POSTのハンドシェイクが遅くなり同期のloopTaskを数秒ブロック→task_wdtが初回POST(約60s)付近でリブートするループに陥る(2026-07-24実機確認)。発熱対策としては断念
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG   # SuperMiniはUSB-C直結でログが見える
  level: INFO                      # 受入検査時はDEBUGに上げる

api:
  reboot_timeout: 0s   # HA未接続で運用するため無効化必須（デフォルトだと15分毎に再起動する）

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none           # 元設定を維持(C3 SuperMini安定化。ESP32既定はlightだがこのボード+APでは none が無難)。発熱対策でlight/80MHz化を試したがtask_wdtリブートで断念(cpu_frequency欄参照)
  output_power: 8.5dB              # C3 SuperMini安定化: TX電力下げてブラウンアウト回避（Probe Request Unsuccessful対策）。8.5dBは下限
  fast_connect: true               # 単一SSIDへスキャン省略で直結。RETRY_HIDDEN/SCAN失敗の連発を回避
  # OTA安定化用の固定IP。mDNS(env-N.local)が引けない/クライアント分離環境では
  # 個体ごとに下記を有効化しIP直指定でOTAする（値はラッパー側substitutionsで上書き推奨）
  # manual_ip:
  #   static_ip: 192.168.0.101
  #   gateway: 192.168.0.1
  #   subnet: 255.255.255.0
  ap:                              # 接続失敗時のフォールバックAP（現地で設定変更用）
    ssid: "${device_name} setup"
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Tokyo

globals:
  - id: g_post_ok
    type: bool
    initial_value: 'false'

http_request:
  timeout: 10s

# ---------- バス ----------
i2c:
  sda: GPIO6
  scl: GPIO7
  frequency: 100kHz   # SCD41の上限が100kHz
  scan: true          # 起動ログに 0x3C / 0x59 / 0x62 が並べば配線OK

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO5   # INMP441のWS
    i2s_bclk_pin: GPIO4    # INMP441のSCK

microphone:
  - platform: i2s_audio
    id: mic_i2s
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO3     # INMP441のSD
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: left          # L/R→GND=左ch。もし無音なら right に変更（クローン基板で逆の個体あり）

# ---------- センサ ----------
sensor:
  - platform: scd4x
    co2:
      name: "CO2"
      id: scd_co2
    temperature:
      name: "Temperature"
      id: scd_temp
    humidity:
      name: "Humidity"
      id: scd_rh
    automatic_self_calibration: true
    temperature_offset: 4.0   # ケース組込後にスマホ/室温計と比較して校正
    update_interval: 15s

  - platform: sgp4x
    voc:
      name: "VOC Index"
      id: sgp_voc
    nox:
      name: "NOx Index"
      id: sgp_nox
    compensation:                    # SCD41の温湿度で補償（この構成の要）
      temperature_source: scd_temp
      humidity_source: scd_rh
    store_baseline: true

  # 騒音: 公式sound_level = 周波数重み無し(Z特性相当)のRMS。
  # A特性が必要になったら stas-sl/esphome-sound-level-meter に差し替え可能だが、
  # 快適性トレンド用途ではオフセット校正済みZ特性で十分と判断。
  - platform: sound_level
    microphone: mic_i2s
    passive: false
    measurement_duration: 1s
    rms:
      name: "Sound Level"
      id: snd_spl
      unit_of_measurement: "dB"
      accuracy_decimals: 1
      filters:
        - offset: 81.1    # 1点校正済(2026-07-24, open_space): スマホ41.3dBA vs 生表示80.2dB → 120+(41.3-80.2)。注:Z特性をdBAに合わせた値

  - platform: copy       # 1分等価騒音レベル（dB算術平均の近似）
    source_id: snd_spl
    id: snd_laeq
    name: "LAeq 1min"
    filters:
      - throttle_average: 60s

  - platform: copy       # 1分最大値
    source_id: snd_spl
    id: snd_lamax
    name: "LAmax 1min"
    filters:
      - max:
          window_size: 60
          send_every: 60
          send_first_at: 60

  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi RSSI"
    update_interval: 60s

  - platform: internal_temperature   # 発熱監視: C3オンダイ(接合部)温度。室温ではなくチップ自体の温度。不正値(53.3℃=raw128等)はコンポーネントが自動除外
    id: mcu_temp
    name: "MCU Temperature"
    update_interval: 30s

# ---------- OLED ----------
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_big
    size: 24
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_small
    size: 11

# CO2の1hトレンド（OLEDの数字右の空きスペースに描くスパークライン）
graph:
  - id: co2_graph
    sensor: scd_co2
    duration: 1h
    width: 40
    height: 22
    min_value: 300
    max_value: 1500
    border: false

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled
    contrast: 40%        # 焼き付き対策その1（スキーマエラーが出るESPHome版なら行ごと削除可）
    update_interval: 2s
    # 2色パネル(Yellow/Blue)前提レイアウト: 上16px=黄(ステータス帯) / 下48px=青(データ帯)
    # 白単色パネルが来ても同じレイアウトでそのまま成立する
    lambda: |-
      // 焼き付き対策その2: 無人時間帯(20-9時)は消灯
      auto t = id(sntp_time).now();
      if (t.is_valid() && (t.hour >= 20 || t.hour < 9)) return;
      // 焼き付き対策その3: 5分ごとに1pxシフト（dyは下方向のみ = 色境界(y=16)を跨がせない）
      unsigned long tick5 = millis() / 300000UL;
      int dx = (int)(tick5 % 3) - 1;
      int dy = (int)(tick5 % 2);
      // ---- 黄色帯(y0-15): 左=部屋名 / 右=状態。CO2警報時は警告バナーに化ける ----
      it.printf(0 + dx, 2 + dy, id(font_small), TextAlign::TOP_LEFT, "${room}");
      if (!std::isnan(id(scd_co2).state) && id(scd_co2).state >= ${co2_high}) {
        it.printf(128 + dx, 2 + dy, id(font_small), TextAlign::TOP_RIGHT, "CO2 HIGH");
      } else {
        char rs[6] = "--";
        if (!std::isnan(id(wifi_rssi).state))
          snprintf(rs, sizeof(rs), "%.0f", id(wifi_rssi).state);
        it.printf(128 + dx, 2 + dy, id(font_small), TextAlign::TOP_RIGHT, "%s %s",
                  rs, id(g_post_ok) ? "tx ok" : "tx --");
      }
      // ---- 青帯(y16-63): データ ----
      if (std::isnan(id(scd_co2).state)) {
        it.printf(64 + dx, 16 + dy, id(font_big), TextAlign::TOP_CENTER, "----");
      } else {
        // 数字=大font / 単位ppm=小font に分離（大fontのpp descenderが下行へ突き抜けるのを回避）
        // 異常値(≥1000ppm)は2s周期で白黒反転して注意喚起。点滅と違い数字が消えるフレームが無い
        bool co2_alarm = id(scd_co2).state >= ${co2_blink};
        bool invert = co2_alarm && ((millis() / 2000UL) % 2) == 1;
        Color fg = invert ? COLOR_OFF : COLOR_ON;
        // 反転帯は数字とppmだけを覆う: x86以降=スパークライン / y40以降=温湿度行 には掛けない
        if (invert) {
          it.filled_rectangle(0 + dx, 16 + dy, 86, 24);
        }
        it.printf(62 + dx, 16 + dy, id(font_big), fg, TextAlign::TOP_RIGHT, "%.0f", id(scd_co2).state);
        it.printf(65 + dx, 25 + dy, id(font_small), fg, TextAlign::TOP_LEFT, "ppm");
      }
      // CO2 1hトレンド: 数字右の空きスペース(x86-)にスパークライン。反転帯の外なので常時通常表示
      it.graph(86 + dx, 17 + dy, id(co2_graph));
      it.printf(64 + dx, 40 + dy, id(font_small), TextAlign::TOP_CENTER, "%.1f°C  %.0f%%",
                id(scd_temp).state, id(scd_rh).state);
      it.printf(64 + dx, 51 + dy, id(font_small), TextAlign::TOP_CENTER, "voc %.0f  %.1f dB",
                id(sgp_voc).state, id(snd_spl).state);

# ---------- InfluxDBへ毎分POST（README手順7の契約に準拠） ----------
interval:
  - interval: 60s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.post:
                url: !secret influx_write_url
                request_headers:
                  Authorization: !secret influx_auth_header
                  Content-Type: "text/plain; charset=utf-8"
                body: !lambda |-
                  std::string lp = "env,room=${room},device=${device_name} ";
                  bool first = true;
                  auto add_f = [&](const char *k, float v, int prec) {
                    if (std::isnan(v)) return;
                    char b[48];
                    snprintf(b, sizeof(b), "%s%s=%.*f", first ? "" : ",", k, prec, v);
                    lp += b; first = false;
                  };
                  auto add_i = [&](const char *k, float v) {
                    if (std::isnan(v)) return;
                    char b[48];
                    snprintf(b, sizeof(b), "%s%s=%di", first ? "" : ",", k, (int) lroundf(v));
                    lp += b; first = false;
                  };
                  add_i("co2",   id(scd_co2).state);
                  add_f("temp",  id(scd_temp).state, 2);
                  add_f("rh",    id(scd_rh).state, 1);
                  add_i("voc",   id(sgp_voc).state);
                  add_i("nox",   id(sgp_nox).state);
                  add_f("laeq",  id(snd_laeq).state, 1);
                  add_f("lamax", id(snd_lamax).state, 1);
                  add_i("rssi",  id(wifi_rssi).state);
                  add_f("mcu_temp", id(mcu_temp).state, 1);   // C3チップ内蔵温度（発熱監視用）
                  if (first) lp += "up=1i";   // 起動直後で全センサNaNでも400を避ける
                  return lp;
                on_response:
                  then:
                    - lambda: |-
                        id(g_post_ok) = (response->status_code == 204);

