name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  esphome-config:
    name: ESPHome 設定検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome
      - name: Prepare dummy secrets
        run: cp config/secrets.yaml.example config/secrets.yaml
      - name: Validate configs
        run: esphome config config/env-1.yaml config/env-2.yaml config/env-3.yaml

  pytest:
    name: Python テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q

  gitleaks:
    name: Secret スキャン
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
