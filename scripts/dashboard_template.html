<title>Office Env — env-1</title>
<style>
  .viz {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #201f1e;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --co2: #3987e5;
    --temp: #d95926;
    --rh: #199e70;
    --voc: #c98500;
    --noise: #d55181;
    --wifi: #9085e9;
    --r: 14px;
    --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:where(:not([data-theme="dark"])) .viz {
      color-scheme: light;
      --plane: #f9f9f7;
      --surface: #fcfcfb;
      --surface-2: #f4f3ef;
      --ink: #0b0b0b;
      --ink-2: #52514e;
      --muted: #898781;
      --grid: #e1e0d9;
      --axis: #c3c2b7;
      --border: rgba(11,11,11,0.10);
      --co2: #2a78d6;
      --temp: #eb6834;
      --rh: #1baf7a;
      --voc: #eda100;
      --noise: #e87ba4;
      --wifi: #4a3aa7;
    }
  }
  :root[data-theme="light"] .viz {
    color-scheme: light;
    --plane: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f4f3ef;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --co2: #2a78d6;
    --temp: #eb6834;
    --rh: #1baf7a;
    --voc: #eda100;
    --noise: #e87ba4;
    --wifi: #4a3aa7;
  }

  * { box-sizing: border-box; }
  .viz {
    font-family: var(--sans);
    background: var(--plane);
    color: var(--ink);
    min-height: 100vh;
    margin: 0;
    padding: 28px clamp(16px, 4vw, 48px) 48px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  /* header */
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
  .head h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 650; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .head .sub { color: var(--ink-2); font-size: 13px; margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .pulse { position: relative; }
  .pulse::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1px solid var(--good); opacity: .5; animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(2.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; } }
  .head .meta { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .head .meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  .toggle { border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .toggle:hover { color: var(--ink); }
  .toggle:focus-visible { outline: 2px solid var(--co2); outline-offset: 2px; }

  /* KPI tiles */
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 14px; }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
  .kpi .lab { display: flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .kpi .val { font-size: 30px; font-weight: 640; line-height: 1; letter-spacing: -0.02em; }
  .kpi .val .u { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
  .kpi .foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
  .kpi .spark { width: 100%; height: 26px; display: block; }
  .status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }

  /* charts */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 14px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 16px 8px; }
  .card .chd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .card .chd .t { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .card .chd .now { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .card .chd .now b { color: var(--ink); font-weight: 650; font-size: 15px; }
  .chart { width: 100%; height: 150px; display: block; touch-action: none; }
  .chart text { font-family: var(--sans); }
  .ax { fill: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .gl { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .base { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
  .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
  .tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 12px; color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,.28); opacity: 0; transition: opacity .09s; white-space: nowrap; }
  .tip .tt { color: var(--muted); font-size: 11px; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .tip .tv { font-weight: 650; font-variant-numeric: tabular-nums; }

  /* table */
  .tblwrap { margin-top: 16px; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); display: none; }
  .tblwrap.on { display: block; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 12px; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: 10.5px; border-bottom: 1px solid var(--border); }
  td { border-bottom: 1px solid var(--grid); color: var(--ink-2); }
  tr:last-child td { border-bottom: none; }
  th:first-child, td:first-child { text-align: left; color: var(--ink); }
  tbody tr:hover td { background: var(--surface-2); }

  footer { margin-top: 22px; color: var(--muted); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--border); padding-top: 14px; }
  footer code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--ink-2); background: var(--surface); padding: 1px 5px; border-radius: 5px; }
</style>

<div class="viz">
  <div class="wrap">
    <header class="head">
      <div>
        <h1>オフィス環境モニタ</h1>
        <div class="sub">
          <span class="chip"><span class="dot pulse" style="background:var(--good)"></span>__DEVLABEL__</span>
          <span class="chip">__ROOMLABEL__</span>
          <span class="chip">ESP32-C3 · SCD41 / SGP41 / INMP441</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">
        <div class="meta">最新 <b id="asof">—</b> JST<br><span id="metaline">__META_LINE__</span></div>
        <button class="toggle" id="tbtn" aria-pressed="false">データ表を表示</button>
      </div>
    </header>

    <section class="kpis" id="kpis" aria-label="現在値"></section>
    <section class="grid" id="charts" aria-label="トレンド"></section>

    <div class="tblwrap" id="tblwrap">
      <table id="tbl"><thead></thead><tbody></tbody></table>
    </div>

    <footer>__FOOTER__</footer>
  </div>
  <div class="tip" id="tip"></div>
</div>

<script>
const DATA = __DATA__;
const RANGE = "__RANGE__";

const METRICS = [
  {k:"co2",  label:"CO2",     unit:"ppm", color:"var(--co2)",   dec:0, status:co2Status},
  {k:"temp", label:"気温",    unit:"°C",  color:"var(--temp)",  dec:1},
  {k:"rh",   label:"湿度",    unit:"%",   color:"var(--rh)",    dec:0},
  {k:"voc",  label:"VOC",     unit:"idx", color:"var(--voc)",   dec:0},
  {k:"laeq", label:"騒音",    unit:"dB",  color:"var(--noise)", dec:1},
  {k:"rssi", label:"WiFi",    unit:"dBm", color:"var(--wifi)",  dec:0},
];

function co2Status(v){
  if (v < 800) return {t:"良好", c:"var(--good)"};
  if (v < 1500) return {t:"注意", c:"var(--warning)"};
  return {t:"高", c:"var(--critical)"};
}
const fmt = (v,d)=> v==null ? "—" : v.toFixed(d);
const last = arr => { for(let i=arr.length-1;i>=0;i--) if(arr[i]!=null) return arr[i]; return null; };
const firstv = arr => { for(let i=0;i<arr.length;i++) if(arr[i]!=null) return arr[i]; return null; };

document.getElementById("asof").textContent = DATA[DATA.length-1].t;

/* ---------- KPI tiles ---------- */
const kwrap = document.getElementById("kpis");
METRICS.forEach(m=>{
  const vals = DATA.map(d=>d[m.k]);
  const cur = last(vals), f = firstv(vals);
  const el = document.createElement("div");
  el.className = "kpi";
  let foot;
  if (m.status){
    const s = m.status(cur);
    foot = `<span class="status" style="color:${s.c};background:color-mix(in srgb, ${s.c} 15%, transparent)"><span class="dot" style="background:${s.c}"></span>${s.t}</span>`;
  } else {
    const delta = (cur!=null && f!=null) ? cur - f : null;
    const sign = delta>0?"+":"";
    foot = `<span style="font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums">${delta==null?"":sign+delta.toFixed(m.dec)+" / "+RANGE}</span>`;
  }
  el.innerHTML = `
    <div class="lab"><span class="dot" style="background:${m.color}"></span>${m.label}</div>
    <div class="val">${fmt(cur,m.dec)}<span class="u">${m.unit}</span></div>
    ${spark(vals, m.color)}
    <div class="foot">${foot}</div>`;
  kwrap.appendChild(el);
});

function spark(vals, color){
  const pts = vals.map((v,i)=>({v,i})).filter(p=>p.v!=null);
  if (pts.length<2) return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none"></svg>`;
  const xs = pts.map(p=>p.i), ys = pts.map(p=>p.v);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const X=i=> x1===x0?0:(i-x0)/(x1-x0)*100;
  const Y=v=> 24 - (y1===y0?12:(v-y0)/(y1-y0)*22) ;
  const d = pts.map((p,i)=>`${i?"L":"M"}${X(p.i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(" ");
  const lp = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${X(lp.i).toFixed(1)}" cy="${Y(lp.v).toFixed(1)}" r="2" fill="${color}"/>
  </svg>`;
}

/* ---------- line charts ---------- */
const cwrap = document.getElementById("charts");
const tip = document.getElementById("tip");
const W=520, H=150, mL=38, mR=14, mT=12, mB=24;

METRICS.forEach(m=>{
  const vals = DATA.map(d=>d[m.k]);
  const pts = DATA.map((d,i)=>({i, t:d.t, v:d[m.k]})).filter(p=>p.v!=null);
  const ys = pts.map(p=>p.v);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  const pad = (y1-y0)*0.25 || Math.abs(y1*0.05) || 1;
  y0-=pad; y1+=pad;
  const n = DATA.length-1;
  const X = i => mL + (n?i/n:0.5)*(W-mL-mR);
  const Y = v => mT + (1-(v-y0)/(y1-y0))*(H-mT-mB);

  const cur = last(vals);
  const card = document.createElement("div");
  card.className="card";

  // gridlines + y labels (3)
  let grid="", ylab="";
  for(let g=0; g<3; g++){
    const gv = y0 + (y1-y0)*g/2;
    const gy = Y(gv);
    grid += `<line class="gl" x1="${mL}" y1="${gy.toFixed(1)}" x2="${W-mR}" y2="${gy.toFixed(1)}"/>`;
    ylab += `<text class="ax" x="${mL-6}" y="${(gy+3).toFixed(1)}" text-anchor="end">${gv.toFixed(m.dec)}</text>`;
  }
  // x labels
  let xlab="";
  [0, Math.floor(n/2), n].forEach((i,k)=>{
    const anc = k===0?"start":k===2?"end":"middle";
    xlab += `<text class="ax" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="${anc}">${DATA[i].t}</text>`;
  });

  const line = pts.map((p,i)=>`${i?"L":"M"}${X(p.i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(" ");
  const area = `M${X(pts[0].i).toFixed(1)} ${(H-mB).toFixed(1)} ` +
    pts.map(p=>`L${X(p.i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(" ") +
    ` L${X(pts[pts.length-1].i).toFixed(1)} ${(H-mB).toFixed(1)} Z`;
  const lp = pts[pts.length-1];
  const gid = "g_"+m.k;

  card.innerHTML = `
    <div class="chd">
      <div class="t"><span class="dot" style="background:${m.color}"></span>${m.label}<span style="color:var(--muted);font-weight:400;font-size:11px">${m.unit}</span></div>
      <div class="now"><b>${fmt(cur,m.dec)}</b> ${m.unit}</div>
    </div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${m.label} トレンド">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${m.color}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${m.color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}
      <line class="base" x1="${mL}" y1="${H-mB}" x2="${W-mR}" y2="${H-mB}"/>
      ${ylab}${xlab}
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="${m.color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${X(lp.i).toFixed(1)}" cy="${Y(lp.v).toFixed(1)}" r="3.4" fill="${m.color}" stroke="var(--surface)" stroke-width="2"/>
      <line class="cross" id="cx_${m.k}" y1="${mT}" y2="${H-mB}"/>
      <circle id="cd_${m.k}" r="3.4" fill="${m.color}" stroke="var(--surface)" stroke-width="2" opacity="0"/>
    </svg>`;
  cwrap.appendChild(card);

  const svg = card.querySelector("svg");
  const cx = card.querySelector("#cx_"+m.k), cd = card.querySelector("#cd_"+m.k);
  // rect はホバー開始時に1回だけ取得（pointermove毎の getBoundingClientRect による強制リフローを回避）
  let rect = null;
  svg.addEventListener("pointerenter", ()=>{ rect = svg.getBoundingClientRect(); });
  svg.addEventListener("pointermove", ev=>{
    if (!rect) rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left)/rect.width * W;
    // nearest point
    let best=pts[0], bd=1e9;
    pts.forEach(p=>{ const d=Math.abs(X(p.i)-px); if(d<bd){bd=d;best=p;} });
    const gx=X(best.i), gy=Y(best.v);
    cx.setAttribute("x1",gx); cx.setAttribute("x2",gx); cx.style.opacity=1;
    cd.setAttribute("cx",gx); cd.setAttribute("cy",gy); cd.style.opacity=1;
    tip.innerHTML = `<div class="tt">${best.t} JST</div><div class="tv" style="color:${m.color}">${fmt(best.v,m.dec)} ${m.unit}</div>`;
    tip.style.opacity=1;
    tip.style.left = Math.min(ev.clientX+14, window.innerWidth-120)+"px";
    tip.style.top = (ev.clientY-10)+"px";
  });
  svg.addEventListener("pointerleave", ()=>{ cx.style.opacity=0; cd.style.opacity=0; tip.style.opacity=0; });
});

/* ---------- table ---------- */
const thead = document.querySelector("#tbl thead");
const tbody = document.querySelector("#tbl tbody");
thead.innerHTML = "<tr><th>時刻 JST</th>" + METRICS.map(m=>`<th>${m.label}<br><span style="font-weight:400">${m.unit}</span></th>`).join("") + "</tr>";
tbody.innerHTML = DATA.map(d=>`<tr><td>${d.t}</td>`+ METRICS.map(m=>`<td>${fmt(d[m.k],m.dec)}</td>`).join("") + "</tr>").join("");

const tbtn = document.getElementById("tbtn"), tblwrap = document.getElementById("tblwrap");
tbtn.addEventListener("click", ()=>{
  const on = tblwrap.classList.toggle("on");
  tbtn.setAttribute("aria-pressed", on);
  tbtn.textContent = on ? "データ表を隠す" : "データ表を表示";
});
</script>
